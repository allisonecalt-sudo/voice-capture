<!doctype html>
<!--
  memos.html — Memos widget shell
  WHAT: the one page for Allison's "memo to self" list — short things to ASK or BRING at a
        specific moment (e.g. "ask Dr. Marar for gastro hafnaya"), typed or spoken, tagged,
        pinned until checked off. One tap from Brain dump's home screen.
  WHY:  before an appointment she accumulates 5-7 questions scattered across chat, phone notes
        and the task DB — this is the one warm place they live until the moment they're needed.
  DECIDED: lang=en + dir=ltr like every personal app; dir="auto" on the free-text inputs (she
        sometimes types Hebrew). Data lives in the Supabase `memos` table (tandem rule — Claude
        reads and writes it too). Checked-off memos are archived (Done fold), never deleted.
  BUILT: empty #app mounted by dist/memos.js; same PWA head wiring as index.html.
  NEXT:  none for v1. (sw.js precache doesn't include this page yet — the main session owns
        sw.js right now; add memos.html/memos.css/dist/memos.js there on its next bump.)
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1a1f1c" />
    <title>Memos</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="memos.css" />

    <!-- PWA: same wiring as index.html so the page feels native inside the installed app. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Memos" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="dist/memos.js"></script>
    <script>
      // Persistent storage — same anti-eviction request as index.html (v34.3). Repeated here
      // because Memos is a home-screen shortcut she can open WITHOUT ever loading index.html;
      // the request is per-origin and idempotent, so whichever page she opens first arms it.
      if (navigator.storage && typeof navigator.storage.persist === 'function') {
        navigator.storage
          .persisted()
          .then((already) => (already ? true : navigator.storage.persist()))
          .then((granted) => {
            if (!granted) {
              console.warn('[PWA] Persistent storage denied — the service worker can be evicted.');
            }
          })
          .catch((err) => {
            console.warn('[PWA] Persistent storage request failed:', err);
          });
      }

      // Same service-worker registration as index.html — no-op if already registered.
      // Also does the same EVICTION DETECTION: Memos is a home-screen shortcut she can open
      // without ever loading index.html, so if the worker was evicted it may well be THIS page
      // that notices. It only raises the flag; index.html owns showing the notice (this page
      // has no room for it, and the news belongs next to the share-in flow).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          let evicted = false;
          try {
            const existing = await navigator.serviceWorker.getRegistration('./');
            evicted = !existing && localStorage.getItem('vc.swEverRegistered') === '1';
          } catch {
            // getRegistration or storage unavailable — fall through and just register.
          }
          try {
            await navigator.serviceWorker.register('sw.js', { scope: './' });
            try {
              localStorage.setItem('vc.swEverRegistered', '1');
              if (evicted) localStorage.setItem('vc.shareRepaired', new Date().toISOString());
            } catch {
              /* storage disabled — registration still succeeded, which is what matters */
            }
          } catch (err) {
            console.warn('[PWA] Service worker registration failed:', err);
          }
        });
      }
    </script>
  </body>
</html>
